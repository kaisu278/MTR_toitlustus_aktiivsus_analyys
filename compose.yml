services:
  db:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: MTR-toitlustus-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data:/data
      - ./scripts:/scripts
      - MTR_toitlustus_base:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
  
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: MTR-toitlustus-python
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    working_dir: /scripts
    tty: true
    command: streamlit run app.py --server.address=0.0.0.0

  
volumes:
  MTR_toitlustus_base:
    name: MTR-toitlustus-base-pgdata